name: Test and deploy preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Stage licensed PBR materials, HDRI and 3D vehicle
        run: npm run assets
      - name: Prepare static site
        run: |
          mkdir -p _site/src
          cp index.html _site/
          cp index.html _site/v0.9.html
          cp src/scene3d.js src/gameplay.js src/main.js src/simulation.js src/asset-stream.js src/controls.js src/character-motor.js src/style.css _site/src/
          cp -r assets _site/assets
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public release and its assets
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${base}v0.9.html" | grep 'VERSIÓN 0.9.0' >/dev/null; then break; fi
            sleep 3
          done
          curl -fsS "${base}v0.9.html" | grep 'VERSIÓN 0.9.0' >/dev/null
          curl -fsS "${base}src/scene3d.js?v=0.9.0" | grep 'createSignaturePlaza' >/dev/null
          curl -fsS "${base}src/character-motor.js?v=0.9.0" | grep 'cameraRelativeDirection' >/dev/null
          curl -fsSI "${base}assets/urban-paving-color.jpg" | grep -i '200' >/dev/null
          curl -fsSI "${base}assets/urban-paving-normal.jpg" | grep -i '200' >/dev/null
          curl -fsSI "${base}assets/weathered-asphalt-color.jpg" | grep -i '200' >/dev/null
          curl -fsSI "${base}assets/stone-brick-normal.jpg" | grep -i '200' >/dev/null
          curl -fsSI "${base}assets/urban-facade.glb" | grep -i '200' >/dev/null
          curl -fsSI "${base}assets/shrub.glb" | grep -i '200' >/dev/null
